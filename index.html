<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeLab - Online Multi-Language Code Runner</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between selection:bg-emerald-500 selection:text-white">

    <!-- Header / Navbar -->
    <header class="border-b border-slate-800 bg-slate-900/50 backdrop-blur sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
            <!-- Brand & Links -->
            <div class="flex items-center gap-6 flex-wrap justify-center sm:justify-start">
                <div class="flex items-center gap-2">
                    <div class="bg-emerald-500 text-slate-950 font-black p-2 rounded-lg text-lg flex items-center justify-center shadow-lg shadow-emerald-500/20">
                        <i class="fa-solid fa-code"></i>
                    </div>
                    <span class="text-xl font-bold tracking-tight bg-gradient-to-r from-emerald-400 to-cyan-400 bg-clip-text text-transparent">CodeLab</span>
                </div>
                
                <!-- Social Links -->
                <div class="flex items-center gap-3 text-sm text-slate-400 border-l border-slate-800 pl-6">
                    <a href="https://youtube.com/@vedanshsrivastava182?si=2pQ9rCvsPJrzp6Jd" target="_blank" class="hover:text-red-400 transition flex items-center gap-1.5"><i class="fa-brands fa-youtube text-red-500"></i> YouTube</a>
                    <a href="https://discord.gg/OTGpDsyVpU" target="_blank" class="hover:text-indigo-400 transition flex items-center gap-1.5"><i class="fa-brands fa-discord text-indigo-400"></i> Discord</a>
                    <a href="https://t.me/+VIG47x9kaJYyODE9" target="_blank" class="hover:text-sky-400 transition flex items-center gap-1.5"><i class="fa-brands fa-telegram text-sky-400"></i> Telegram</a>
                </div>
            </div>

            <!-- Auth Section -->
            <div class="flex items-center gap-3">
                <span id="user" class="text-sm font-medium text-emerald-400"></span>
                <button id="login" class="bg-white hover:bg-slate-200 text-slate-950 text-sm font-semibold px-4 py-2 rounded-lg transition shadow-md flex items-center gap-2">
                    <i class="fa-brands fa-google"></i> Google Login
                </button>
                <button id="logout" style="display:none" class="bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 border border-rose-500/30 text-sm font-semibold px-4 py-2 rounded-lg transition">
                    Logout
                </button>
            </div>
        </div>
    </header>

    <!-- Main Workspace -->
    <main class="max-w-7xl mx-auto px-6 py-8 flex-grow w-full">
        <!-- Controls Bar -->
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-6 bg-slate-900/40 p-4 rounded-xl border border-slate-800/80 backdrop-blur">
            <div class="flex items-center gap-4 w-full sm:w-auto">
                <div>
                    <label for="languageSelect" class="block text-xs font-medium text-slate-400 uppercase tracking-wider mb-1">Language</label>
                    <select id="languageSelect" class="bg-slate-900 border border-slate-700/80 px-4 py-2.5 rounded-lg text-sm text-slate-200 focus:outline-none focus:border-emerald-500 transition shadow-inner">
                        <option value="python">Python</option>
                        <option value="cpp">C++</option>
                        <option value="c">C</option>
                        <option value="php">PHP</option>
                        <option value="java">Java</option>
                    </select>
                </div>
            </div>
            
            <button onclick="executeCode()" id="runBtn" class="bg-emerald-600 hover:bg-emerald-500 text-slate-950 font-bold px-6 py-2.5 rounded-lg transition shadow-lg shadow-emerald-600/20 flex items-center gap-2 text-sm w-full sm:w-auto justify-center">
                <i class="fa-solid fa-play"></i> Run Code
            </button>
        </div>

        <!-- Editor and Output Grid -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <!-- Code Input Area -->
            <div class="flex flex-col">
                <label class="block mb-2 text-sm font-medium text-slate-300 flex items-center justify-between">
                    <span><i class="fa-solid fa-file-code text-emerald-400 mr-1.5"></i> Source Code</span>
                    <span class="text-xs text-slate-500 font-normal">Auto-saved in browser</span>
                </label>
                <textarea id="sourceCode" rows="18" class="w-full bg-slate-900 border border-slate-800 p-4 rounded-xl font-mono text-sm focus:outline-none focus:border-emerald-500/50 text-emerald-300 resize-none shadow-inner leading-relaxed" placeholder="Write your code here..."></textarea>
            </div>
            
            <!-- Output Terminal Area -->
            <div class="flex flex-col">
                <label class="block mb-2 text-sm font-medium text-slate-300 flex items-center justify-between">
                    <span><i class="fa-solid fa-terminal text-cyan-400 mr-1.5"></i> Terminal Output</span>
                    <span class="text-xs text-slate-500 font-normal">Piston API Execution</span>
                </label>
                <pre id="output" class="w-full h-[400px] bg-slate-900 border border-slate-800 p-4 rounded-xl font-mono text-sm overflow-auto text-slate-300 shadow-inner leading-relaxed">Output will appear here...</pre>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="border-t border-slate-800 py-6 text-center text-xs text-slate-500">
        <p>&copy; 2026 CodeLab. Built with Piston API & Firebase Auth.</p>
    </footer>

    <!-- Firebase & Code Logic Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged }
            from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

        // Firebase Configuration
        const app = initializeApp({
            apiKey: "AIzaSyC3CQUaWcM-nojdz6aemuoBazsL2x74HzY",
            authDomain: "vedansh-90106.firebaseapp.com",
            projectId: "vedansh-90106",
            storageBucket: "vedansh-90106.firebasestorage.app",
            messagingSenderId: "115273647385",
            appId: "1:115273647385:web:7a85879ed1a5ec7b01f188"
        });
        const auth = getAuth(app);

        // Auth Event Listeners
        document.getElementById("login").onclick = () =>
            signInWithPopup(auth, new GoogleAuthProvider());
        document.getElementById("logout").onclick = () => signOut(auth);

        onAuthStateChanged(auth, (u) => {
            document.getElementById("user").textContent = u ? "Hi, " + u.displayName.split(" ")[0] : "";
            document.getElementById("login").style.display = u ? "none" : "flex";
            document.getElementById("logout").style.display = u ? "inline-block" : "none";
        });
    </script>

    <!-- Code Runner & Local Storage Script -->
    <script>
        const codeTextArea = document.getElementById('sourceCode');

        // Load saved code from browser when page opens
        window.addEventListener('DOMContentLoaded', () => {
            const savedCode = localStorage.getItem('user_saved_code');
            if (savedCode) {
                codeTextArea.value = savedCode;
            }
        });

        // Save code automatically to browser storage as user types (jab tak data clear na ho)
        codeTextArea.addEventListener('input', () => {
            localStorage.setItem('user_saved_code', codeTextArea.value);
        });

        // Piston API Code Execution
        async function executeCode() {
            const language = document.getElementById('languageSelect').value;
            const code = codeTextArea.value;
            const outputElement = document.getElementById('output');
            const runBtn = document.getElementById('runBtn');

            if (!code.trim()) {
                outputElement.textContent = "Error: Please enter some code to run!";
                return;
            }

            outputElement.textContent = "Running code, please wait...";
            runBtn.disabled = true;
            runBtn.classList.add("opacity-50", "cursor-not-allowed");

            try {
                const response = await fetch("https://emkc.org/api/v2/piston/execute", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        language: language,
                        version: "*",
                        files: [
                            {
                                content: code
                            }
                        ]
                    })
                });

                const data = await response.json();
                
                if (data.run) {
                    let resultText = data.run.output;
                    if (data.run.stderr) {
                        resultText += "\n" + data.run.stderr;
                    }
                    outputElement.textContent = resultText || "Code executed successfully with no output.";
                } else {
                    outputElement.textContent = "Failed to execute code via API.";
                }
            } catch (error) {
                outputElement.textContent = "Network Error: " + error.message;
            } finally {
                runBtn.disabled = false;
                runBtn.classList.remove("opacity-50", "cursor-not-allowed");
            }
        }
    </script>
</body>
</html>
